[package]
name = "trollstov"
version = "0.2.0-dev"
edition.workspace = true
rust-version.workspace = true
description = "A music player for the terminal where your files and their metadata are all you need."
homepage = "https://github.com/hikikones/troll/trollstov"
repository = "https://github.com/hikikones/troll/trollstov"
license.workspace = true
keywords = ["audio", "music", "player", "terminal", "tui"]
categories = ["command-line-utilities", "multimedia::audio"]

[dependencies]
bevy_derive = { workspace = true }
bevy_ecs = { workspace = true }
bevy_state = { workspace = true }
clap = { workspace = true }
clap-cargo = { workspace = true }
directories = { workspace = true }
ecs = { workspace = true }
fastrand = { workspace = true }
lofty = { workspace = true }
rodio = { workspace = true }
serde = { workspace = true }
serde_repr = { workspace = true }
shared = { workspace = true, features = ["bevy"] }
terminal = { workspace = true, features = ["bevy"] }
toml = { workspace = true }
utils = { workspace = true }
walkdir = { workspace = true }
widgets = { workspace = true }
zbus = { workspace = true }

[features]
default = []
opus = ["rodio/symphonia-libopus"]
