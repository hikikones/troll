[package]
name = "trollink2"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "A simple flashcard application for the terminal."
homepage = "https://github.com/hikikones/troll/trollink"
repository = "https://github.com/hikikones/troll/trollink"
license.workspace = true
keywords = ["flashcards", "spaced-repetion", "study", "terminal", "tui"]
categories = ["command-line-utilities"]

[dependencies]
bevy_derive = { workspace = true }
bevy_ecs = { workspace = true }
bevy_state = { workspace = true }
clap = { workspace = true }
clap-cargo = { workspace = true }
directories = { workspace = true }
ecs = { workspace = true }
edit = { workspace = true }
fsrs = { workspace = true }
ron = { workspace = true }
serde = { workspace = true }
shared = { workspace = true }
terminal = { workspace = true }
toml = { workspace = true }
utils = { workspace = true }
widgets2 = { workspace = true, features = ["bevy"] }
